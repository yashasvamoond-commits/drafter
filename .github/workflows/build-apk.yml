name: Build APK

on:
  push:
    branches: ["main", "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build offline dictionaries
        run: |
          cd scripts
          npm install --no-audit --no-fund
          node build-data.mjs
          ls -lh ../app/data

      - name: Build font library (62 families, offline woff2)
        run: |
          node scripts/build-fonts.mjs
          echo "faces: $(ls app/vendor/fonts/*.woff2 | wc -l)"
          du -sh app/vendor/fonts app/js/fonts.js app/css/fonts.css

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK/tools/bin" "$SDK/platform-tools"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          ls "$SDK" || true

      - name: Install SDK components
        run: |
          (yes | sdkmanager --licenses > /dev/null 2>&1) || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/NyayaLekh-2.0.0.apk
          ls -lh out

      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          import zipfile, sys
          apk = "out/NyayaLekh-2.0.0.apk"
          z = zipfile.ZipFile(apk)
          names = set(z.namelist())
          required = [
            "AndroidManifest.xml",
            "assets/index.html",
            "assets/css/app.css",
            "assets/css/fonts.css",
            "assets/js/core.js",
            "assets/js/i18n.js",
            "assets/js/fonts.js",
            "assets/js/app.js",
            "assets/js/editor.js",
            "assets/js/doc.js",
            "assets/js/dict.js",
            "assets/js/text.js",
            "assets/js/kd-table.js",
            "assets/data/legal.js",
            "assets/data/hi-words.js",
            "assets/data/hi-dict.js",
            "assets/data/en-words.js",
            "assets/vendor/jszip.min.js",
            "assets/vendor/fonts/noto-serif-dev-400.woff2",
            "assets/vendor/fonts/noto-serif-dev-700.woff2",
            "assets/vendor/fonts/noto-sans-dev-400.woff2",
            "assets/vendor/fonts/tiro-dev-400.woff2",
            "assets/vendor/fonts/mukta-400.woff2",
            "assets/vendor/fonts/kalam-400.woff2",
            "assets/vendor/fonts/tinos-400.woff2",
            "assets/vendor/fonts/arimo-700.woff2",
            "assets/vendor/fonts/eb-garamond-400.woff2",
            "assets/vendor/fonts/inter-400.woff2",
            "assets/vendor/fonts/courier-prime-400.woff2",
          ]
          faces = [n for n in names if n.startswith("assets/vendor/fonts/") and n.endswith(".woff2")]
          families = sorted({n.rsplit("-", 1)[0] for n in faces})
          print(f"font faces: {len(faces)}, families: {len(families)}")
          if len(faces) < 100 or len(families) < 45:
              print("FONT LIBRARY TOO SMALL:", len(faces), "faces /", len(families), "families")
              sys.exit(1)
          missing = [r for r in required if r not in names]
          print(f"APK size: {z.fp.seek(0, 2) or 0}")
          for r in required:
              if r in names:
                  print(f"  OK  {r:45s} {z.getinfo(r).file_size:>9,} bytes")
          if missing:
              print("MISSING:", missing); sys.exit(1)
          html = z.read("assets/index.html").decode("utf-8", "replace")
          if "js/fonts.js" not in html or "css/fonts.css" not in html:
              print("index.html does not load the generated font library"); sys.exit(1)
          print(f"\nAll {len(required)} required assets present; index.html wires fonts.")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyayaLekh-APK
          path: out/NyayaLekh-2.0.0.apk
          retention-days: 90

      - name: Publish direct download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create apk-latest out/NyayaLekh-2.0.0.apk \
            --title "NyayaLekh 2.0 — APK (latest build)" \
            --notes "Installable APK for Android 7.0+ (Lenovo Yoga Tab Plus and other tablets). English + Hindi interface, 62 offline font families, Rajasthan court templates, DOCX export. Built from ${GITHUB_SHA}."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/NyayaLekh-2.0.0.apk"
