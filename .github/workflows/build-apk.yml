name: Build APK

on:
  push:
    branches: ["main", "arena/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build offline dictionaries
        run: |
          cd scripts
          npm install --no-audit --no-fund
          node build-data.mjs
          ls -lh ../app/data

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for d in "$SDK/cmdline-tools/latest/bin" "$SDK/tools/bin" "$SDK/platform-tools"; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          ls "$SDK" || true

      - name: Install SDK components
        run: |
          (yes | sdkmanager --licenses > /dev/null 2>&1) || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Assemble APK
        run: |
          cd android
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/NyayaLekh-1.0.0.apk
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NyayaLekh-APK
          path: out/NyayaLekh-1.0.0.apk
          retention-days: 90

      - name: Publish direct download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create apk-latest out/NyayaLekh-1.0.0.apk \
            --title "न्यायलेख — NyayaLekh APK (latest build)" \
            --notes "Installable APK for Android 7.0+ (Lenovo Yoga Tab and other tablets). Works fully offline. Built from ${GITHUB_SHA}."
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/apk-latest/NyayaLekh-1.0.0.apk"
