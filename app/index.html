<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="color-scheme" content="light dark">
<title>न्यायलेख — NyayaLekh Legal Drafting</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ==================== splash ==================== -->
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 64 64" width="72" height="72" aria-hidden="true">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="#f6efe2"/>
      <path d="M32 12v6" stroke="#8a5a1b" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 22h28M32 18v30M24 48h16" stroke="#1f2a44" stroke-width="3" stroke-linecap="round"/>
      <path d="M18 22l-6 12a6 6 0 0 0 12 0z" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M46 22l-6 12a6 6 0 0 0 12 0z" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>न्यायलेख</h1>
  <p>NyayaLekh · Legal Drafting Suite</p>
  <div class="splash-bar"><i></i></div>
  <small id="splashMsg">हिन्दी विधिक प्रारूपण · शब्दकोश लोड हो रहा है…</small>
</div>

<!-- ==================== app bar ==================== -->
<header id="appbar">
  <button class="ibtn" id="btnMenu" data-i18n-title="menu" title="मेन्यू">☰</button>
  <div class="titlewrap">
    <input id="docTitle" class="doctitle" value="अनाम दस्तावेज़" aria-label="दस्तावेज़ शीर्षक" spellcheck="false">
    <span id="docSub" class="docsub">स्वतः सहेजा गया</span>
  </div>
  <button class="ibtn" id="btnUndo" title="पूर्ववत (Undo)">↶</button>
  <button class="ibtn" id="btnRedo" title="पुनः (Redo)">↷</button>
  <button class="ibtn" id="btnSearch" title="खोजें (Ctrl+F)">⌕</button>
  <button class="ibtn primary" id="btnExport" title="फ़ाइल / PDF">⤓</button>
</header>

<!-- ==================== ribbon ==================== -->
<section id="ribbon" aria-label="फ़ॉर्मैटिंग">
  <div class="ribbon-row">
    <div class="ribbon-scroll">
      <select id="selFont" class="sel" title="फ़ॉन्ट / Font">
        <option value="serif">Noto Serif देवनागरी</option>
        <option value="sans">Noto Sans देवनागरी</option>
        <option value="tiro">Tiro देवनागरी</option>
        <option value="mono">मशीन (Mono)</option>
      </select>
      <select id="selSize" class="sel narrow" title="आकार / Size">
        <option>9</option><option>10</option><option>11</option><option selected>12</option>
        <option>13</option><option>14</option><option>15</option><option>16</option>
        <option>18</option><option>20</option><option>22</option><option>24</option><option>28</option><option>32</option>
      </select>
      <span class="divider"></span>
      <button class="rbtn" data-cmd="bold" title="मोटा (Ctrl+B)"><b>B</b></button>
      <button class="rbtn" data-cmd="italic" title="तिरछा (Ctrl+I)"><i>I</i></button>
      <button class="rbtn" data-cmd="underline" title="रेखांकित (Ctrl+U)"><u>U</u></button>
      <button class="rbtn" data-cmd="strikeThrough" title="काटें"><s>S</s></button>
      <button class="rbtn" data-cmd="superscript" title="उर्ध्व">x²</button>
      <button class="rbtn" data-cmd="subscript" title="अधो">x₂</button>
      <span class="divider"></span>
      <button class="rbtn" data-cmd="justifyLeft" title="बाएँ">≡</button>
      <button class="rbtn" data-cmd="justifyCenter" title="केंद्र">⋮≡</button>
      <button class="rbtn" data-cmd="justifyRight" title="दाएँ">≡⋮</button>
      <button class="rbtn" data-cmd="justifyFull" title="सीधा (Justify)">☰</button>
      <span class="divider"></span>
      <button class="rbtn" data-cmd="insertUnorderedList" title="बिंदु सूची">•—</button>
      <button class="rbtn" data-cmd="insertOrderedList" title="क्रमांक सूची">1—</button>
      <button class="rbtn" data-act="indent" title="इंडेंट बढ़ाएँ">→|</button>
      <button class="rbtn" data-act="outdent" title="इंडेंट घटाएँ">|←</button>
      <span class="divider"></span>
      <button class="rbtn" data-act="lineHeight" title="पंक्ति अंतर">↕≡</button>
      <button class="rbtn" data-act="para" title="अनुच्छेद सेटिंग">¶</button>
      <button class="rbtn" data-act="clearFmt" title="फ़ॉर्मैट हटाएँ">T<sub>x</sub></button>
    </div>
  </div>
  <div class="ribbon-row second">
    <div class="ribbon-scroll">
      <button class="chip" data-insert="h1">शीर्षक</button>
      <button class="chip" data-insert="h2">उपशीर्षक</button>
      <button class="chip" data-insert="center">केंद्रित पंक्ति</button>
      <button class="chip" data-insert="right">दायाँ</button>
      <button class="chip" data-insert="pagebreak">पृष्ठ विराम</button>
      <span class="divider"></span>
      <button class="chip accent" data-open="templates">आदर्श प्रारूप</button>
      <button class="chip accent" data-open="convert">कृतिदेव → यूनिकोड</button>
      <button class="chip" data-open="dict">शब्दकोश</button>
      <button class="chip" data-open="spell">वर्तनी जाँच</button>
      <button class="chip" data-open="voice">बोलकर लिखें</button>
      <button class="chip" data-open="legal">विधिक सहायक</button>
      <span class="spacer"></span>
    </div>
  </div>
</section>

<!-- ==================== workspace ==================== -->
<main id="workspace">
  <aside id="rail" aria-label="औज़ार">
    <button class="railbtn" data-open="templates"><span>आ</span><em>प्रारूप</em></button>
    <button class="railbtn" data-open="dict"><span>श</span><em>शब्दकोश</em></button>
    <button class="railbtn" data-open="spell"><span>✓</span><em>वर्तनी</em></button>
    <button class="railbtn" data-open="convert"><span>कृ</span><em>कन्वर्टर</em></button>
    <button class="railbtn" data-open="voice"><span>🎙</span><em>बोलें</em></button>
    <button class="railbtn" data-open="legal"><span>§</span><em>विधिक</em></button>
    <button class="railbtn" data-open="files"><span>🗂</span><em>फ़ाइलें</em></button>
  </aside>

  <div id="canvasWrap">
    <div id="ruler" aria-hidden="true"><div class="ruler-inner" id="rulerInner"></div></div>
    <div id="canvas">
      <div id="pages" spellcheck="false"></div>
    </div>
  </div>

  <aside id="sidePanel" hidden>
    <div class="panel-head">
      <strong id="panelTitle">शब्दकोश</strong>
      <button class="ibtn" id="panelClose" title="बंद करें">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</main>

<!-- ==================== status bar ==================== -->
<footer id="statusbar">
  <button class="sbtn" id="stLang" title="भाषा बदलें">हिं</button>
  <span id="stWords">0 शब्द</span>
  <span id="stChars">0 अक्षर</span>
  <span id="stPage">पृष्ठ 1</span>
  <span class="grow"></span>
  <span id="stSave" class="save-ind">सहेजा गया</span>
  <button class="sbtn" id="stZoomOut">−</button>
  <button class="sbtn" id="stZoom" title="ज़ूम">100%</button>
  <button class="sbtn" id="stZoomIn">+</button>
  <button class="sbtn" id="btnKeyboard" title="कीबोर्ड दिखाएँ">⌨</button>
</footer>

<!-- ==================== floating selection tools ==================== -->
<div id="selTools" hidden>
  <button data-cmd="bold"><b>B</b></button>
  <button data-cmd="italic"><i>I</i></button>
  <button data-cmd="underline"><u>U</u></button>
  <button data-act="highlight">🖍</button>
  <button data-act="comment">✎</button>
</div>

<!-- ==================== drawer ==================== -->
<div id="drawer" hidden>
  <div class="drawer-head">
    <div class="brand"><span class="brandmark">न्या</span><div><strong>न्यायलेख</strong><small>NyayaLekh · राजस्थान विधिक प्रारूपण</small></div></div>
  </div>
  <nav class="drawer-nav">
    <button data-open="new"><b>⊞</b><span data-i18n="newDoc">नया दस्तावेज़</span></button>
    <button data-open="files"><b>🗂</b><span data-i18n="myFiles">मेरी फ़ाइलें</span></button>
    <button data-open="import"><b>⇤</b><span data-i18n="importFile">फ़ाइल खोलें / आयात</span></button>
    <button data-open="export"><b>⇥</b><span data-i18n="exportDoc">निर्यात / प्रिंट</span></button>
    <hr>
    <button data-open="templates"><b>⚖</b><span data-i18n="templates">न्यायालयीन प्रारूप</span></button>
    <button data-open="courts"><b>🏛</b><span data-i18n="courts">न्यायालय सेटिंग</span></button>
    <button data-open="dict"><b>अ</b><span data-i18n="dictionary">हिन्दी–अंग्रेज़ी शब्दकोश</span></button>
    <button data-open="spell"><b>✓</b><span data-i18n="spellcheck">वर्तनी जाँचक</span></button>
    <button data-open="voice"><b>🎙</b><span data-i18n="voice">बोलकर लिखें</span></button>
    <button data-open="convert"><b>कृ</b><span data-i18n="convert">कृतिदेव / लीगेसी कन्वर्टर</span></button>
    <button data-open="translit"><b>अ⇄A</b><span data-i18n="translit">लिप्यंतरण (टाइपिंग)</span></button>
    <button data-open="typo"><b>✂</b><span data-i18n="typo">मात्रा-सुधारक</span></button>
    <button data-open="legal"><b>§</b><span data-i18n="legal">विधिक सहायक</span></button>
    <hr>
    <button data-open="page"><b>▭</b><span data-i18n="pageSetup">पृष्ठ सेटअप / मार्जिन</span></button>
    <button data-open="display"><b>◐</b><span data-i18n="display">फ़ॉन्ट, आकार व थीम</span></button>
    <button data-open="help"><b>?</b><span data-i18n="help">सहायता</span></button>
    <button data-open="about"><b>ⓘ</b><span data-i18n="about">परिचय व लाइसेंस</span></button>
  </nav>
  <div class="drawer-foot">v1.0 · पूर्णतः ऑफ़लाइन · कोई डेटा बाहर नहीं जाता</div>
</div>
<div id="scrim" hidden></div>

<!-- ==================== modal ==================== -->
<div id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <header class="modal-head">
      <strong id="modalTitle">—</strong>
      <button class="ibtn" id="modalClose">✕</button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<!-- ==================== find bar ==================== -->
<div id="findbar" hidden>
  <input id="findInput" placeholder="खोजें…" autocomplete="off">
  <button class="sbtn" id="findPrev">↑</button>
  <button class="sbtn" id="findNext">↓</button>
  <span id="findCount" class="findcount"></span>
  <button class="sbtn" id="findClose">✕</button>
</div>

<div id="toasts" aria-live="polite"></div>

<!-- ==================== scripts ==================== -->
<script src="vendor/jszip.min.js"></script>
<script src="js/core.js"></script>
<script src="js/kd-table.js"></script>
<script src="data/legal.js"></script>
<script src="js/text.js"></script>
<script src="js/dict.js"></script>
<script src="js/doc.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
